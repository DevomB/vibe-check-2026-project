name = "poker"
defaultTargets = ["Engine", "poker"]

# The Lean engine. Human-owned specs live in Poker/Spec/; keep them short and reviewable.
[[lean_lib]]
name = "Poker"

[[lean_lib]]
name = "Engine"

[[lean_exe]]
name = "poker"
root = "Main"

# Times the equity counts on the compiled engine and checks them against the TypeScript reference.
[[lean_exe]]
name = "equity-bench"
root = "EquityBench"

# The main theorem statements (Challenge) and their proofs (Solution), for `lake comparator`.
# Not a default target: the Challenge file is all `sorry` on purpose.
[[lean_lib]]
name = "Checks"
roots = ["Checks.Challenge", "Checks.Solution"]

# Differential test driver for tests/diff/run.ts (MVP section 7). Not part of the game.
[[lean_exe]]
name = "difftest"
root = "DiffTest"
