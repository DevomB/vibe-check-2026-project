name = "poker"
defaultTargets = ["Engine", "poker", "kuhn-serve"]

# The Lean engine. Human-owned specs live in Poker/Spec/; keep them short and reviewable.
[[lean_lib]]
name = "Poker"

[[lean_lib]]
name = "Engine"

[[lean_exe]]
name = "poker"
root = "Main"

# Times the equity counts on the compiled engine and checks them against the TypeScript reference.
[[lean_exe]]
name = "equity-bench"
root = "EquityBench"

# The main theorem statements (Challenge) and their proofs (Solution), for `lake comparator`.
# Not a default target: the Challenge file is all `sorry` on purpose.
[[lean_lib]]
name = "Checks"
roots = ["Checks.Challenge", "Checks.Solution"]

# Times the river betting set and the river review on the compiled engine.
[[lean_exe]]
name = "river-bench"
root = "RiverBench"

# Differential test driver for tests/diff/run.ts (MVP section 7). Not part of the game.
[[lean_exe]]
name = "difftest"
root = "DiffTest"

# Play Kuhn poker in the terminal against the proven equilibrium bot (Engine/KuhnGame.lean).
[[lean_exe]]
name = "kuhn"
root = "KuhnMain"

# Kuhn poker for the web page (/kuhn): JSON lines in and out, like the Hold'em program.
[[lean_exe]]
name = "kuhn-serve"
root = "KuhnServe"
